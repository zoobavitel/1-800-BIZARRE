# Gitleaks configuration for 1-800-BIZARRE
# Extends the default ruleset with project-specific patterns.

title = "1-800-BIZARRE Gitleaks Config"

[extend]
# Use the official gitleaks default rules as the base
useDefault = true

[[rules]]
id = "django-auth-token"
description = "Django REST Framework authentication token (40-char hex)"
regex = '''(?i)(auth[\s_-]?token|authorization)[\"'\s:=]+[0-9a-f]{40}\b'''
tags = ["secret", "django"]

[[rules]]
id = "hardcoded-password-assignment"
description = "Literal password string passed to set_password() in code"
# Matches set_password('...' or "...") but NOT set_password(some_function())
regex = '''set_password\(\s*[\"'][^\"']{6,}[\"']\s*\)'''
tags = ["secret", "password"]

[[rules]]
id = "fixture-hashed-password"
description = "Django hashed password stored in a fixture file"
regex = '''pbkdf2_sha256\$[0-9]+\$[A-Za-z0-9]+\$[A-Za-z0-9+/=]{40,}'''
tags = ["secret", "fixture"]
[rules.allowlist]
# Placeholder hashes (all-x) used in sanitised test fixtures are fine
regexes = ['''pbkdf2_sha256\$[0-9]+\$x{10,}\$x{40,}''']

[[rules]]
id = "tailscale-tailnet-hostname"
description = "A real Tailscale tailnet name (tail + 6 hex). Use <your-tailnet> or tailnet-example in code and docs."
regex = '''[a-z0-9-]+\.tail[0-9a-f]{6}\.ts\.net'''
tags = ["infra", "private"]

[[rules]]
id = "private-lan-ip"
description = "A home LAN address (192.168.x.y). Use 192.168.1.X in docs and examples."
regex = '''\b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b'''
tags = ["infra", "private"]

[[rules]]
id = "ngrok-tunnel-host"
description = "A real ngrok tunnel host. Use example.ngrok-free.dev."
regex = '''\b[a-z]+-[a-z]+-[a-z]+\.ngrok-free\.(dev|app)\b'''
tags = ["infra", "private"]

[allowlist]
description = "Global allowlist"
paths = [
  # Lock files and vendored assets are never secrets
  "package-lock.json",
  "yarn.lock",
  # Node modules
  "node_modules",
]
# Doc placeholders like `Authorization: Token YOUR_TOKEN` are not secrets.
regexes = [
  '''(?i)^<?your[_-]?(auth[_-]?)?token(_here)?>?$''',
]
