# CI: frontend + backend + integration tests
# CD: GitHub Pages on master
# Optional manual deploy: runner joins Tailscale, then SSH to bizarre-api CT (secrets LXC_*)

name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      lxc_action:
        description: "LXC: run CI only, or deploy on master via Tailscale + SSH (bizarre-api). Choosing deploy confirms manual release checks are complete."
        type: choice
        options:
          - none
          - deploy
        default: none

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Run frontend tests
        run: cd frontend && npm test -- --coverage --watchAll=false

      - name: Run frontend linting
        run: npm run lint

      - name: Build frontend
        run: cd frontend && npm run build

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django tests
        env:
          DJANGO_SETTINGS_MODULE: app.settings
        run: cd backend/src && python manage.py test

      - name: Check Django migrations
        env:
          DJANGO_SETTINGS_MODULE: app.settings
        run: cd backend/src && python manage.py makemigrations --check --dry-run

  integration-test:
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r backend/requirements.txt

      - name: Setup test database
        env:
          DJANGO_SETTINGS_MODULE: app.settings
        run: |
          cd backend/src
          python manage.py migrate
          python manage.py loaddata characters/fixtures/*.json

      - name: Run integration tests
        env:
          DJANGO_SETTINGS_MODULE: app.settings
          RUN_BACKEND_INTEGRATION: "1"
        run: |
          set -e
          cd backend/src
          python manage.py runserver 127.0.0.1:8000 --noreload &
          BACKEND_PID=$!
          trap 'kill $BACKEND_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8000/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:8000/" >/dev/null
          cd ../../frontend
          npm test -- --testPathPattern=integration --watchAll=false

  automated-ui-smoke:
    needs: [integration-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Key on @playwright/test version only — not whole lockfile (unrelated deps bust cache).
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Exact Playwright version only — no restore-keys (partial browser trees hang install).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Playwright cache status
        run: |
          echo "playwright-version=${{ steps.playwright-version.outputs.version }}"
          echo "cache-hit=${{ steps.playwright-cache.outputs.cache-hit }}"

      # install-deps / --with-deps can stall on "Processing triggers for man-db" on ubuntu-latest.
      - name: Avoid man-db apt trigger stalls
        run: |
          sudo apt-get --yes remove --purge man-db || true
        timeout-minutes: 5

      - name: Install Playwright browsers and OS deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install --with-deps chromium
        timeout-minutes: 15

      - name: Install Playwright OS deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd frontend && npx playwright install-deps chromium
        timeout-minutes: 10

      # Production build + static serve — faster and stable than `npm start` (webpack dev) on CI.
      - name: Run automated UI smoke
        timeout-minutes: 15
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000/1-800-BIZARRE"
        run: |
          set -e
          cd frontend
          npm run build
          SITE="$(mktemp -d)"
          mkdir -p "${SITE}/1-800-BIZARRE"
          cp -a build/. "${SITE}/1-800-BIZARRE/"
          npx --yes serve@14 "${SITE}" -l "tcp://127.0.0.1:3000" -n &
          SERVE_PID=$!
          trap 'kill $SERVE_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3000/1-800-BIZARRE/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:3000/1-800-BIZARRE/" >/dev/null
          cd ..
          npm run test:automated-ui

  performance-budget:
    needs: [automated-ui-smoke]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r backend/requirements.txt

      - name: Run performance budget checks (warn-only)
        env:
          DJANGO_SETTINGS_MODULE: app.settings
          PERF_API_BASE_URL: "http://127.0.0.1:8000"
          # Must match CRA homepage/PUBLIC_URL (/1-800-BIZARRE); dev server masked low Lighthouse scores.
          PERF_FRONTEND_URL: "http://127.0.0.1:3000/1-800-BIZARRE"
          # Default Lighthouse (mobile emulation) is harsh and noisy on ubuntu-latest; desktop is stable for regression checks.
          PERF_LIGHTHOUSE_PRESET: "desktop"
          GENERATE_SOURCEMAP: "false"
        run: |
          set -e
          cd backend/src
          python manage.py runserver 127.0.0.1:8000 --noreload &
          BACKEND_PID=$!
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8000/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:8000/" >/dev/null
          cd ../../frontend
          npm run build
          PERF_SITE="$(mktemp -d)"
          mkdir -p "${PERF_SITE}/1-800-BIZARRE"
          cp -a build/. "${PERF_SITE}/1-800-BIZARRE/"
          cd ..
          npx --yes serve@14 "${PERF_SITE}" -l "tcp://127.0.0.1:3000" -n &
          FRONTEND_PID=$!
          trap 'kill $BACKEND_PID 2>/dev/null || true; kill $FRONTEND_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3000/1-800-BIZARRE/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:3000/1-800-BIZARRE/" >/dev/null
          node scripts/perf/api-latency-check.mjs
          node scripts/perf/lighthouse-budget-check.mjs

  deploy-github-pages:
    needs: [automated-ui-smoke]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
          force_orphan: true

  deploy-lxc:
    needs: [automated-ui-smoke]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.lxc_action == 'deploy' &&
      github.ref == 'refs/heads/master'
    steps:
      # OAuth client: https://tailscale.com/s/oauth-clients — scope "Devices" write (auth keys),
      # tag must match `tags` below (e.g. tag:ci) and your tailnet tagOwners ACL.
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.LXC_SSH_HOST }}

      # Passing multiline PEM via `key: ${{ secrets... }}` can strip newlines; drone-ssh then fails ssh.ParsePrivateKey.
      - name: Write SSH deploy key
        run: |
          install -dm700 "$GITHUB_WORKSPACE/.ssh-ci"
          printf '%s\n' "$PRIVATE_KEY" >"$GITHUB_WORKSPACE/.ssh-ci/lxc_deploy"
          chmod 600 "$GITHUB_WORKSPACE/.ssh-ci/lxc_deploy"
        env:
          PRIVATE_KEY: ${{ secrets.LXC_SSH_KEY }}

      - name: Trust server host key (Tailscale resolves LXC_SSH_HOST)
        env:
          SSH_HOST: ${{ secrets.LXC_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Deploy via SSH (bizarre-api)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.LXC_SSH_HOST }}
          username: ${{ secrets.LXC_SSH_USER }}
          key_path: ${{ github.workspace }}/.ssh-ci/lxc_deploy
          request_pty: true
          timeout: 3m
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/bizarre
            git pull --ff-only
            source .venv/bin/activate
            pip install -q -r backend/requirements.txt
            pip install -q -r backend/requirements-prod.txt
            cd backend/src
            export DJANGO_SETTINGS_MODULE=app.settings_prod
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart gunicorn
            sudo systemctl restart celery-worker || true
