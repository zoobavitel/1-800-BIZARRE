name: Black (autofix PR)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Python 3.11 (same as ci.yml). Do not use rickstaa/action-black:
      # its Docker image tracks python:3-slim (now 3.15) and black==23.11.0
      # cannot run there.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install black
        run: pip install "black==23.11.0"

      - name: Format backend/src with black
        run: black backend/src

      # create-pull-request no-ops when the working tree is clean.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore(black): format backend/src"
          commit-message: "chore(black): format backend/src"
          body: |
            Automated Black formatting.

            Triggered by: ${{ github.actor }}
            Source SHA: ${{ github.sha }}
          base: "master"
          branch: "actions/black-format"
          delete-branch: true
