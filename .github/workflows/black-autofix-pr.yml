name: Black (autofix PR)

on:
  pull_request:
    branches: [master]

permissions:
  contents: write
  actions: write

jobs:
  autofix:
    # Fork PRs cannot be pushed to with GITHUB_TOKEN. Those still fail CI via black --check.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # `--verbose` keeps the action off its default `--check --diff` (that mode
      # does not write files). An empty options string is easy to drop, which would
      # bring the default back. psf/black 26.10.1 advertises is_formatted but never
      # writes GITHUB_OUTPUT, so the commit action's dirty check is the signal.
      - name: Format backend/src with Black
        uses: psf/black@stable
        with:
          options: "--verbose"
          src: "./backend/src"
          version: "~= 26.0"

      - name: Commit Black formatting
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: black format backend/src"
          file_pattern: backend/src
          branch: ${{ github.head_ref }}

      # GITHUB_TOKEN pushes do not start pull_request workflows. Dispatch CI so the
      # formatted commit is tested. lxc_action stays at its default (none).
      - name: Re-run CI on the formatted commit
        if: steps.auto-commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "${{ github.head_ref }}"
